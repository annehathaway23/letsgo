name: probe

# Temporary: reports dependency compatibility data as annotations (readable
# through the GitHub API). Removed once the project is scaffolded.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe.yml"

jobs:
  versions:
    runs-on: windows-latest
    steps:
      - name: crates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $o = @()
          foreach ($c in 'tauri','tauri-build','portable-pty','rusqlite','keyring','serde','serde_json','tauri-plugin-opener') {
            $l = (cargo search $c --limit 1 2>&1 | Where-Object { $_ -match '^[a-z0-9_-]+ = ' } | Select-Object -First 1)
            $o += "$l"
          }
          Write-Host "::notice title=crates::$($o -join '%0A')"
          exit 0

      - name: npm compat
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $o = @()
          foreach ($pair in @(
            @('typescript-eslint','peerDependencies'),
            @('eslint','engines'),
            @('vite','engines'),
            @('vitest','engines'),
            @('@testing-library/react','peerDependencies'),
            @('@testing-library/jest-dom','version'),
            @('@testing-library/user-event','version'),
            @('eslint-plugin-react-hooks','peerDependencies'),
            @('@xterm/addon-web-links','version'),
            @('zustand','version'),
            @('typescript','engines')
          )) {
            $j = ((npm view $pair[0] $pair[1] --json 2>&1) -join ' ')
            $o += ("{0} {1} = {2}" -f $pair[0], $pair[1], $j)
          }
          Write-Host "::notice title=compat1::$(($o | Select-Object -First 6) -join '%0A')"
          Write-Host "::notice title=compat2::$(($o | Select-Object -Skip 6) -join '%0A')"
          exit 0
